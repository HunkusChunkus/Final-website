<main class="pagecontent contact">
    <h1>Contact Us</h1>

    <form action="https://formspree.io/f/mqpkzpqe" method="post">
        <label for="first-name">First Name:</label>
        <input type="text" id="first-name" name="first name" required><br><br>

        <label for="last-name">Last Name:</label>
        <input type="text" id="last-name" name="last name" required>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>

        <label for="phone-number">Phone Number:</label>
        <input type="tel" id="phone-number" name="phone number" minlength="10" maxlength="15" ><br><br>

        <label for="city">City:</label>
        <input type="text" id="city" name="city" ><br> <br><br>


        <input type="checkbox" id="terms" name="I agree to the terms and conditions" required>
        <label for="terms">I agree to the terms and conditions:</label>
        <br><br><br>
        <input type="checkbox" id="want-to-know" name="I want to receive notifications about initiatives" required>
        <label for="want-to-know">I want to receive notifications about initiatives:</label>

        <p id="form-error" class="form-error" hidden></p>
        <p id="form-success" class="form-success" hidden>Thanks! Your message has been sent.</p>

        <input type="submit" id="submit" value="Submit" class="submit">
        <input type="reset" id="reset" value="Reset" class="reset">
     
    </form>
</main>
